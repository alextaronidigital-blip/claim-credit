<title>Benchmark Hotel YDG</title>
<style>
/* Finance hub: fascia KPI con misuratori, griglia a filetti, numeri tabellari a destra.
   Un solo accento istituzionale; verde e rosso solo per il segno del valore. */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --surface-2:#E8EAEE; --surface-3:#DBDFE5;
  --fg:#101418; --fg-muted:#596170; --fg-faint:#8A919E;
  --line:#D5D9E0; --line-strong:#B4BAC5;
  --accent:#27508F; --accent-soft:#E3EAF4; --accent-line:#9DB3D5;
  --ok:#11704A; --ok-soft:#DEEFE7;
  --warn:#8A5B06; --warn-soft:#F7ECD8;
  --crit:#9C2C22; --crit-soft:#F7E1DE;
  --info:#2A5A7A; --info-soft:#E1EAF0;
  --r:3px;
  --font-ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-display:var(--font-ui);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1114; --surface:#15191D; --surface-2:#1C2126; --surface-3:#252B31;
  --fg:#E6E9ED; --fg-muted:#98A1AD; --fg-faint:#6E7682;
  --line:#272D34; --line-strong:#39414A;
  --accent:#7FA6E8; --accent-soft:#17202E; --accent-line:#3A4C6B;
  --ok:#4FB88A; --ok-soft:#12251D;
  --warn:#D1A24E; --warn-soft:#241E12;
  --crit:#DF7E72; --crit-soft:#271814;
  --info:#7FA8C4; --info-soft:#141E25;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:#15191D; --surface-2:#1C2126; --surface-3:#252B31;
  --fg:#E6E9ED; --fg-muted:#98A1AD; --fg-faint:#6E7682;
  --line:#272D34; --line-strong:#39414A;
  --accent:#7FA6E8; --accent-soft:#17202E; --accent-line:#3A4C6B;
  --ok:#4FB88A; --ok-soft:#12251D;
  --warn:#D1A24E; --warn-soft:#241E12;
  --crit:#DF7E72; --crit-soft:#271814;
  --info:#7FA8C4; --info-soft:#141E25;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--font-ui);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}
.num,.r{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}

/* ---------- testata ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line-strong);box-shadow:inset 0 2px 0 var(--accent)}
.top-in{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding:13px 18px 11px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-muted);font-weight:400}
h1{font-size:19px;font-weight:600}
.who{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.who label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint);font-weight:500}
select,input[type=text],input[type=number],input[type=url],input[type=email],input[type=tel],input[type=date],textarea{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:5px 7px;font-size:12.5px;max-width:100%}
input[type=number],input[type=date]{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:58px;line-height:1.5;font-size:12.5px}
.btn{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r);padding:5px 10px;font-size:12px;font-weight:500;letter-spacing:.01em}
.btn:hover{background:var(--surface-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#0B1016}}
:root[data-theme="dark"] .btn-primary{color:#0B1016}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:none;border:1px solid transparent;color:var(--fg-muted);padding:3px 6px}
.btn-ghost:hover{background:var(--surface-2);color:var(--fg)}

/* ---------- fascia KPI ---------- */
.stats{display:flex;gap:0;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--surface)}
.stat{flex:1 1 128px;min-width:0;padding:8px 18px 9px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);font-weight:500}
.stat .v{font-family:var(--font-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;letter-spacing:-.02em}
.stat .g{font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);letter-spacing:.01em}
.meter{height:2px;background:var(--surface-3);margin-top:5px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.meter.full span{background:var(--ok)}

/* ---------- barra filtri ---------- */
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 18px;background:var(--bg)}
.bar .grow{flex:1 1 180px;min-width:150px}
.chipset{display:flex;gap:4px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line-strong);border-radius:var(--r);padding:4px 9px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;color:var(--fg-muted)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

/* ---------- griglia ---------- */
.wrap{padding:0 18px 56px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line-strong)}
table{border-collapse:collapse;width:100%;min-width:1240px}
th{position:sticky;top:0;z-index:5;background:var(--surface);text-align:left;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
th .dir{color:var(--accent)}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tr.flagged td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.name{font-weight:600;display:block;line-height:1.3;font-size:13px}
.sub{font-size:11px;color:var(--fg-muted)}
.score{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end;width:100%}
.score b{font-family:var(--font-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.band{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:1px 4px;border-radius:2px;font-weight:600;min-width:58px;text-align:center}
.band-caldo{background:var(--ok-soft);color:var(--ok)}
.band-tiepido{background:var(--warn-soft);color:var(--warn)}
.band-freddo{background:var(--surface-2);color:var(--fg-faint)}
.voto{display:inline-block;min-width:20px;text-align:center;font-family:var(--font-mono);font-size:11.5px;font-weight:600;padding:1px 4px;border-radius:2px}
.v1{background:var(--crit-soft);color:var(--crit)}
.v2{background:var(--crit-soft);color:var(--crit);opacity:.85}
.v3{background:var(--warn-soft);color:var(--warn)}
.v4{background:var(--ok-soft);color:var(--ok);opacity:.9}
.v5{background:var(--ok-soft);color:var(--ok)}
.v0{background:var(--surface-2);color:var(--fg-faint)}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:var(--r);border:1px solid var(--line-strong);white-space:nowrap}
.pill-select{appearance:none;-webkit-appearance:none;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r);padding:2px 6px;font-size:11px;letter-spacing:.02em;cursor:pointer;max-width:150px}
.soc{display:flex;gap:2px}
.soc i{width:19px;height:17px;border-radius:2px;display:grid;place-items:center;font-family:var(--font-mono);font-size:9px;font-weight:600;font-style:normal;border:1px solid var(--line)}
.soc i.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.soc i.want{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);border-style:dashed}
.soc i.off{background:none;color:var(--fg-faint)}
.prefs{display:flex;gap:2px}
.prefs button{width:20px;height:20px;border-radius:2px;border:1px solid var(--line-strong);background:none;font-family:var(--font-mono);font-size:9.5px;font-weight:600;color:var(--fg-faint);display:grid;place-items:center;padding:0}
.prefs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .prefs button[aria-pressed=true]{color:#0B1016}}
:root[data-theme="dark"] .prefs button[aria-pressed=true]{color:#0B1016}

/* ---------- stato vuoto ---------- */
.empty{background:var(--surface);border:1px solid var(--line-strong);padding:34px 24px;text-align:center}
.empty h2{font-size:17px;margin-bottom:5px}
.empty p{color:var(--fg-muted);max-width:54ch;margin:0 auto 16px;font-size:12.5px}
.empty .acts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;max-width:800px;margin:24px auto 0;text-align:left;background:var(--line)}
.cols div{background:var(--surface);padding:9px 11px}
.cols .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.cols .d{font-size:11.5px;color:var(--fg-muted)}

/* ---------- scheda ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,11,14,.5);z-index:40;opacity:0;transition:opacity .16s}
.scrim.open{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;border-left:1px solid var(--line-strong);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease}
.drawer.open{transform:none}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line-strong);padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:inset 0 2px 0 var(--accent)}
.dhead h2{font-size:17px}
.dbody{overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.dfoot{border-top:1px solid var(--line-strong);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:7px;align-items:center;background:var(--surface)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-muted);font-weight:600;padding:0 0 5px;border-bottom:1px solid var(--line-strong);width:100%;margin-bottom:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:440px){.row2,.row3{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font-size:10.5px;letter-spacing:.04em;color:var(--fg-muted)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:7px}
.scard{border:1px solid var(--line);border-radius:var(--r);padding:7px}
.scard .top2{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
.scard strong{font-size:11.5px;letter-spacing:.01em}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{background:none;border:0;padding:2px 5px;font-size:10px;letter-spacing:.03em;color:var(--fg-muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed=true]{color:#0B1016}}
:root[data-theme="dark"] .seg button[aria-pressed=true]{color:#0B1016}
.rate{display:flex;gap:3px}
.rate button{width:29px;height:26px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--fg-muted)}
.rate button[aria-pressed=true]{border-color:transparent;font-weight:700}
.rate button[aria-pressed=true][data-v="1"]{background:var(--crit-soft);color:var(--crit)}
.rate button[aria-pressed=true][data-v="2"]{background:var(--crit-soft);color:var(--crit)}
.rate button[aria-pressed=true][data-v="3"]{background:var(--warn-soft);color:var(--warn)}
.rate button[aria-pressed=true][data-v="4"]{background:var(--ok-soft);color:var(--ok)}
.rate button[aria-pressed=true][data-v="5"]{background:var(--ok-soft);color:var(--ok)}
.rep{display:flex;flex-direction:column;gap:7px}
.repitem{border:1px solid var(--line);border-radius:var(--r);padding:8px;position:relative;display:flex;flex-direction:column;gap:6px}
.repitem .del{position:absolute;top:4px;right:4px}
.scorebox{background:var(--surface-2);border-left:2px solid var(--accent);padding:10px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.scorebox .big{font-family:var(--font-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.scorebox ul{margin:0;padding-left:15px;font-size:11px;color:var(--fg-muted);flex:1 1 190px;min-width:0;font-family:var(--font-mono)}
.hint{font-size:11px;color:var(--fg-faint)}
.note{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint);padding:12px 18px 0;max-width:90ch;letter-spacing:.01em}
.banner{background:var(--warn-soft);color:var(--warn);border-left:2px solid var(--warn);padding:8px 11px;font-size:12px;margin:0 18px 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.saving{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint)}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="eyebrow">Your Digital Growth · Verticale ospitalità</span>
      <h1>Benchmark Hotel</h1>
    </div>
    <div class="who">
      <label for="me">Stai lavorando come</label>
      <select id="me"></select>
      <button class="btn btn-primary" id="add">+ Nuova attività</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div id="banner"></div>

<div class="bar">
  <input type="text" id="q" class="grow" placeholder="Cerca nome, località, referente…" autocomplete="off">
  <select id="fStato"><option value="">Tutti gli stati</option></select>
  <select id="fLoc"><option value="">Ogni località</option></select>
  <select id="fVert"><option value="">Ogni verticale</option></select>
  <select id="fCan"><option value="">Ogni canale</option></select>
  <div class="chipset">
    <button class="chip" id="cPref" aria-pressed="false">Solo mie preferenze</button>
    <button class="chip" id="cFlag" aria-pressed="false">Solo segnalate</button>
  </div>
</div>

<main class="wrap">
  <div id="view"></div>
  <p class="note" id="note"></p>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Scheda attività">
  <div class="dhead">
    <h2 id="dtitle">Scheda</h2>
    <button class="btn-ghost" id="dclose" aria-label="Chiudi scheda">✕</button>
  </div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot">
    <button class="btn btn-primary" id="dsave">Salva</button>
    <button class="btn" id="ddel">Elimina</button>
    <span class="saving" id="dstate"></span>
  </div>
</aside>

<script>
"use strict";

/* ===== Configurazione: cambia qui le etichette, non nel resto del codice ===== */
const STATI = [
  "Da valutare","Da contattare","Contattato","Appuntamento fissato",
  "Proposta inviata","Chiuso vinto","Chiuso perso","Non in target"
];
const STATO_COLORE = {
  "Da valutare":"info","Da contattare":"info","Contattato":"warn","Appuntamento fissato":"warn",
  "Proposta inviata":"accent","Chiuso vinto":"ok","Chiuso perso":"crit","Non in target":"muted"
};
const TEAM = [
  {key:"alex",nome:"Alex",ini:"A"},
  {key:"riccardo",nome:"Riccardo",ini:"R"},
  {key:"nadir",nome:"Nadir",ini:"N"},
  {key:"alessandro",nome:"Alessandro",ini:"Al"}
];
const SOCIAL = [
  {key:"instagram",label:"Instagram",ini:"IG"},
  {key:"facebook",label:"Facebook",ini:"FB"},
  {key:"tiktok",label:"TikTok",ini:"TT"},
  {key:"youtube",label:"YouTube",ini:"YT"},
  {key:"linkedin",label:"LinkedIn",ini:"LI"}
];
const SOCIAL_CHIAVE = ["instagram","facebook","tiktok"];
const LOCALITA = ["Mare","Montagna","Collina / Tenuta","Lago","Città d'arte","Terme"];
const VERTICALI = ["Hotel di lusso","Resort / Relais","Agriturismo di charme","Ristorazione","Wellness / SPA","Altro"];
const CATEGORIE = ["5★ Lusso","5★","4★ Sup","4★","Boutique","Non classificato"];
const APERTURA = ["Tutto l'anno","Stagionale","Chiuso","Da verificare"];
const SERVIZI = [
  {key:"social",label:"Social organico"},
  {key:"ads",label:"Advertising"},
  {key:"sito",label:"Sito / Landing"},
  {key:"fotovideo",label:"Foto / Video"}
];
const TIPI_CONTATTO = ["Chiamata","Email","DM","Incontro","Altro"];
const CANALI = ["Da definire","Referral","Warm contact","Visita di persona","Chiamata a freddo"];
const LINGUE = ["Italiano","Tedesco","Italiano + Tedesco"];
// Obiettivi dichiarati nel briefing: 10k/mese entro fine anno, funnel 50 -> 20 -> 6
const OBIETTIVI = { mrr:10000, lista:150, contattate:50, appuntamenti:20, proposte:6, visitaMinuti:40 };
const GRUPPI = {
  contattate:["Contattato","Appuntamento fissato","Proposta inviata","Chiuso vinto"],
  appuntamenti:["Appuntamento fissato","Proposta inviata","Chiuso vinto"],
  proposte:["Proposta inviata","Chiuso vinto"],
  vinti:["Chiuso vinto"],
  chiusi:["Chiuso vinto","Chiuso perso","Non in target"]
};
const eur = n => Number(n) ? new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(n)) : "–";

/* ===== Punteggio di priorità =====
   Opportunità = quanto è debole il digitale × quanto la struttura può spendere.
   Una struttura che lavora bene (Google alto, molte recensioni) ma comunica male
   è il lead migliore: ha i soldi e ha il problema. */
function punteggio(a){
  const parti = [];
  let t = 0;
  const vs = Number(a.votoSocial) || 0;
  if (vs > 0){ const p = (5 - vs) * 6; t += p; if (p) parti.push([p, "Social deboli (voto " + vs + "/5)"]); }
  const mancanti = SOCIAL_CHIAVE.filter(k => !(a.social && a.social[k] && a.social[k].presente));
  if (mancanti.length){ const p = mancanti.length * 5; t += p; parti.push([p, "Assenti su " + mancanti.length + " social chiave"]); }
  const vseo = Number(a.seo && a.seo.voto) || 0;
  if (vseo > 0){ const p = (5 - vseo) * 3; t += p; if (p) parti.push([p, "SEO debole (voto " + vseo + "/5)"]); }
  if (a.canale === "Referral" || a.canale === "Warm contact"){ t += 12; parti.push([12, "Arriva da " + a.canale.toLowerCase()]); }
  const min = Number(a.minuti) || 0;
  if (min > 0 && min <= OBIETTIVI.visitaMinuti){ t += 5; parti.push([5, "Visitabile in giornata (" + min + " min)"]); }
  if (a.sito && a.sito.assente){ t += 20; parti.push([20, "Nessun sito web"]); }
  else { const v = Number(a.sito && a.sito.voto) || 0; if (v > 0){ const p = (5 - v) * 4; t += p; if (p) parti.push([p, "Sito migliorabile (voto " + v + "/5)"]); } }
  const rat = Number(a.google && a.google.rating) || 0;
  const rec = Number(a.google && a.google.recensioni) || 0;
  // La reputazione alta vale come opportunita solo se il digitale e debole:
  // struttura che lavora bene ma comunica male = ha i soldi e ha il problema.
  const debole = (vs > 0 && vs <= 3) || (a.sito && (a.sito.assente || ((Number(a.sito.voto)||0) > 0 && Number(a.sito.voto) <= 3))) || mancanti.length >= 2;
  if (debole && rat >= 4.5 && rec >= 100){ t += 20; parti.push([20, "Struttura forte su Google, mal comunicata"]); }
  else if (debole && rat >= 4.2 && rec >= 40){ t += 10; parti.push([10, "Buona reputazione Google"]); }
  else if (rat >= 4.5 && rec >= 100){ t += 5; parti.push([5, "Reputazione Google solida"]); }
  const cat = a.categoria || "";
  if (cat === "5★ Lusso"){ t += 15; parti.push([15, "Fascia lusso"]); }
  else if (cat === "5★"){ t += 12; parti.push([12, "Cinque stelle"]); }
  else if (cat === "4★ Sup" || cat === "Boutique"){ t += 8; parti.push([8, "Fascia alta"]); }
  else if (cat === "4★"){ t += 5; parti.push([5, "Quattro stelle"]); }
  const np = TEAM.filter(m => a.preferenze && a.preferenze[m.key]).length;
  if (np){ const p = Math.min(np * 5, 20); t += p; parti.push([p, "Segnalata da " + np + (np === 1 ? " persona" : " persone")]); }
  return { totale: Math.max(0, Math.min(100, Math.round(t))), parti: parti.sort((x,y) => y[0]-x[0]) };
}
function banda(n){ return n >= 65 ? "caldo" : n >= 38 ? "tiepido" : "freddo"; }

function salva(id, dati){
  if (!db) return Promise.resolve(false);
  const prec = coda.get(id) || Promise.resolve();
  const p = prec.catch(() => {}).then(() => db.collection("attivita").doc(id).set(dati))
    .then(() => true)
    .catch(e => { avvisa(e && e.code === "invalid_argument"
      ? "Non hai i permessi per scrivere: chiedi ad Alex di alzarti a Contributor nel menu di condivisione."
      : "Salvataggio non riuscito. Riprova tra un momento."); return false; });
  coda.set(id, p);
  return p;
}

function visibili(){
  const q = filtri.q.trim().toLowerCase();
  return righe.filter(r => {
    const a = r.dati;
    if (filtri.stato && a.stato !== filtri.stato) return false;
    if (filtri.loc && a.tipoLocalita !== filtri.loc) return false;
    if (filtri.vert && a.verticale !== filtri.vert) return false;
    if (filtri.can && a.canale !== filtri.can) return false;
    if (filtri.pref && !a.preferenze[io]) return false;
    if (filtri.flag && !a.flag) return false;
    if (q){
      const hay = [a.nome, a.comune, a.provincia, a.regione, a.note, a.referralDa,
        (a.referenti||[]).map(x => x.nome + " " + x.ruolo).join(" ")].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((x,y) => {
    const c = ordine.campo, s = ordine.dir === "asc" ? 1 : -1;
    let a, b;
    if (c === "punteggio"){ a = x.punti.totale; b = y.punti.totale; }
    else if (c === "votoSocial"){ a = Number(x.dati.votoSocial)||0; b = Number(y.dati.votoSocial)||0; }
    else if (c === "stato"){ a = STATI.indexOf(x.dati.stato); b = STATI.indexOf(y.dati.stato); }
    else if (c === "fee"){ a = Number(x.dati.economia.fee)||0; b = Number(y.dati.economia.fee)||0; }
    else { a = (x.dati.nome||"").toLowerCase(); b = (y.dati.nome||"").toLowerCase(); }
    return a < b ? -s : a > b ? s : 0;
  });
}

    '</div><button type="button" class="btn" id="addref" style="align-self:flex-start">+ Referente</button></fieldset>';

  h += '<fieldset><legend>Contatti e follow-up</legend><div class="rep" id="rep-tp">' +
    (a.touchpoint.length ? a.touchpoint.map((x,i) =>
      '<div class="repitem"><button class="btn-ghost del" data-deltp="' + i + '" aria-label="Elimina contatto">✕</button>' +
      '<div class="row3"><label class="f"><span>Data</span><input type="date" data-tp="' + i + '" data-k="data" value="' + esc(x.data) + '"></label>' +
      '<label class="f"><span>Tipo</span><select data-tp="' + i + '" data-k="tipo">' + TIPI_CONTATTO.map(t => "<option" + (t === x.tipo ? " selected" : "") + ">" + esc(t) + "</option>").join("") + "</select></label>" +
      '<label class="f"><span>Prossima azione</span><input type="date" data-tp="' + i + '" data-k="prossima" value="' + esc(x.prossima) + '"></label></div>' +
      '<label class="f"><span>Esito</span><textarea data-tp="' + i + '" data-k="esito" style="min-height:52px">' + esc(x.esito) + "</textarea></label></div>").join("")
      : '<p class="hint">Nessun contatto registrato.</p>') +
    '</div><button type="button" class="btn" id="addtp" style="align-self:flex-start">+ Contatto</button></fieldset>';

  $("#dbody").innerHTML = h;
  collegaScheda();
}

function leggiScheda(){
  const a = bozza, g = id => { const e = document.getElementById(id); return e ? e.value : ""; };
  const ck = id => { const e = document.getElementById(id); return e ? e.checked : false; };
  a.nome = g("f-nome").trim(); a.verticale = g("f-vert"); a.categoria = g("f-cat");
  a.tipoLocalita = g("f-loc"); a.apertura = g("f-ap");
  a.comune = g("f-com").trim(); a.provincia = g("f-prov").trim().toUpperCase(); a.regione = g("f-reg").trim();
  a.canale = g("f-canale"); a.referralDa = g("f-refda").trim(); a.lingua = g("f-lingua"); a.inseritaDa = g("f-ins");
  a.minuti = g("f-min") === "" ? null : Number(g("f-min"));
  a.sito.url = g("f-sito").trim(); a.sito.assente = ck("f-sito-no"); a.sito.nota = g("f-sito-nota");
  a.seo.nota = g("f-seonota");
  a.economia.setup = g("f-setup") === "" ? null : Number(g("f-setup"));
  a.economia.fee = g("f-fee") === "" ? null : Number(g("f-fee"));
  a.google.rating = g("f-gr") === "" ? null : Number(g("f-gr"));
  a.google.recensioni = g("f-gn") === "" ? null : Number(g("f-gn"));
  a.google.nota = g("f-gnota");
  a.stato = g("f-stato"); a.flag = ck("f-flag"); a.note = g("f-note");
  SERVIZI.forEach(s => a.servizi[s.key] = ck("sv-" + s.key));
  SOCIAL.forEach(s => {
    a.social[s.key].handle = g("h-" + s.key).trim();
    const n = g("n-" + s.key);
    a.social[s.key].follower = n === "" ? null : Number(n);
  });
  document.querySelectorAll("[data-ref]").forEach(e => { a.referenti[+e.dataset.ref][e.dataset.k] = e.value; });
  document.querySelectorAll("[data-tp]").forEach(e => { a.touchpoint[+e.dataset.tp][e.dataset.k] = e.value; });
  return a;
}

/* ===== Eventi ===== */
function collegaTabella(){
  document.querySelectorAll("th.sortable").forEach(th => th.onclick = () => {
    const c = th.dataset.sort;
    if (ordine.campo === c) ordine.dir = ordine.dir === "asc" ? "desc" : "asc";
    else { ordine.campo = c; ordine.dir = c === "nome" ? "asc" : "desc"; }
    renderTabella();
  });
  document.querySelectorAll("tbody tr[data-id]").forEach(tr => tr.onclick = e => {
    if (e.target.closest("[data-pref]") || e.target.closest("[data-stato]")) return;
    apri(tr.dataset.id);
  });
  document.querySelectorAll("[data-stato]").forEach(s => s.onchange = () => {
    const r = righe.find(x => x.id === s.dataset.stato); if (!r) return;
    const d = JSON.parse(JSON.stringify(r.dati)); d.stato = s.value; salva(r.id, d);
  });
  document.querySelectorAll("[data-pref]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const r = righe.find(x => x.id === b.dataset.pref); if (!r) return;
    const d = JSON.parse(JSON.stringify(r.dati));
    d.preferenze[b.dataset.chi] = !d.preferenze[b.dataset.chi];
    b.setAttribute("aria-pressed", String(d.preferenze[b.dataset.chi]));
    salva(r.id, d);
  });
}
function collegaVuoto(){
  const e1 = $("#e1"), e2 = $("#e2");
  if (e1) e1.onclick = creaNuova;
  if (e2) e2.onclick = esempi;
}
function collegaScheda(){
  $("#dbody").querySelectorAll(".rate").forEach(r => r.querySelectorAll("button").forEach(b => b.onclick = () => {
    const v = Number(b.dataset.v);
    if (r.id === "f-vs") bozza.votoSocial = v;
    else if (r.id === "f-seov") bozza.seo.voto = v;
    else bozza.sito.voto = v;
    leggiScheda(); disegnaScheda();
  }));
  $("#dbody").querySelectorAll("[data-soc]").forEach(seg => seg.querySelectorAll("button").forEach(b => b.onclick = () => {
    const k = seg.dataset.soc, m = b.dataset.m;
    leggiScheda();
    bozza.social[k][m] = !bozza.social[k][m];
    if (m === "presente" && bozza.social[k].presente) bozza.social[k].daProporre = false;
    disegnaScheda();
  }));
  const fp = $("#f-prefs");
  if (fp) fp.querySelectorAll("button").forEach(b => b.onclick = () => {
    leggiScheda();
    bozza.preferenze[b.dataset.chi] = !bozza.preferenze[b.dataset.chi];
    disegnaScheda();
  });
  const sn = $("#f-sito-no"); if (sn) sn.onchange = () => { leggiScheda(); disegnaScheda(); };
  ["f-gr","f-gn","f-cat","f-canale","f-min"].forEach(id => { const e = document.getElementById(id); if (e) e.onchange = () => { leggiScheda(); disegnaScheda(); }; });
  const nm = $("#f-nome"); if (nm) nm.oninput = () => { $("#dtitle").textContent = nm.value || "Nuova attività"; };
  $("#addref").onclick = () => { leggiScheda(); bozza.referenti.push({nome:"",ruolo:"",email:"",telefono:""}); disegnaScheda(); };
  $("#addtp").onclick = () => { leggiScheda(); bozza.touchpoint.unshift({data:new Date().toISOString().slice(0,10),tipo:TIPI_CONTATTO[0],esito:"",prossima:""}); disegnaScheda(); };
  $("#dbody").querySelectorAll("[data-delref]").forEach(b => b.onclick = () => { leggiScheda(); bozza.referenti.splice(+b.dataset.delref,1); disegnaScheda(); });
  $("#dbody").querySelectorAll("[data-deltp]").forEach(b => b.onclick = () => { leggiScheda(); bozza.touchpoint.splice(+b.dataset.deltp,1); disegnaScheda(); });
}

function creaNuova(){
  if (!db){ avvisa("Il database non è raggiungibile da questa vista, non posso creare righe."); return; }

  const d = nuovaAttivita();
  righe.push({id, dati:d, punti:punteggio(d)});

}

  const id = sel;
  db.collection("attivita").doc(id).delete().catch(() => avvisa("Eliminazione non riuscita."));
  righe = righe.filter(r => r.id !== id);

};

/* ===== Avvio capability ===== */
(async () => {
  try {
    user = await claude.use("user");
    if (user){
      const can = await user.can("data.write");
      if (can === false) scrivibile = false;
      try {
        const me = await user.me();
        const n = (me && me.name || "").toLowerCase();
        const hit = TEAM.find(m => n.includes(m.nome.toLowerCase()));
        if (hit && !localStorage.getItem("ydg-io")){ io = hit.key; $("#me").value = io; }
      } catch(_){}
    }
  } catch(_){}
  if (!scrivibile) avvisa("Puoi consultare il benchmark ma non modificarlo: serve il livello Contributor nel menu di condivisione.");

  try { db = await claude.use("db"); } catch(_){ db = null; }
  if (!db){
    avvisa("Database non raggiungibile da questa vista: accedi con il tuo account per vedere e modificare i dati.");
    return;
  }
  db.collection("attivita").onSnapshot(
    snap => {
      righe = snap.docs.map(d => { const dati = normalizza(d.data()); return {id:d.id, dati, punti:punteggio(dati)}; });
      renderStats();
      if (!sel) renderTabella(); else { renderTabella(); }
    },
    err => { avvisa(err && err.code === "revoked" ? "Accesso al database revocato: ricarica la pagina." : "Connessione al database interrotta: ricarica la pagina."); }
  );
})();
